<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>index</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <script type="module" src="index.js"></script>
	<canvas id="myCanvas" width="500px" height="500px" ">
	</canvas>
    <form id="Form">
      <input type="text" id="input1"  maxlength="5"><br>
      <input type="text" id="input2"  maxlength="5"><br>
      <input type="text" id="input3"  maxlength="5"><br>
      <input type="text" id="input4"  maxlength="5"><br>
      <input type="text" id="input5"  maxlength="5"><br>
      <button type="submit">Submit</button>
    </form>

    <script>
	  document.getElementById("Form").addEventListener("submit", function(event){
        event.preventDefault();
        window.onSubmitWord(event);
      });
	  const canvas = document.getElementById("myCanvas");
	  const ctx = canvas.getContext("2d");
	  ctx.fillStyle = "grey";
	  for(let i = 0; i < 5; i++){
		  for(let j = 0; j < 5; j++){
		  	ctx.fillRect(j * 90 + 10, i * 90 + 10, 80, 80);
		  }
	  }
    </script>
  </body>
</html>
