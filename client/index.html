  <body>
    <script type="module" src="index.js"></script>
	  <div class="panel">
	  	<h2 class="line-1 anim-typewriter" style="color: greenyellow;">Solve to enter!</h2>

      	<div id="input1" class="input-div"></div>

      	<div id="input2" class="input-div"></div>

      	<div id="input3" class="input-div"></div>

      	<div id="input4" class="input-div"></div>

      	<div id="input5" class="input-div"></div>
	  </div>
    <script>
		//document.getElementById("Form").addEventListener("submit", function(event){
		//	event.preventDefault();
		//	window.onSubmitWord(event);
		//});
		//putting all inputs into an array
		const inputs = document.querySelectorAll('.letter-input');
		
    inputs.forEach((input, index) => {
			input.addEventListener('input', (e) => {
				const value = e.target.value;
				if(value.length === 1 && index < inputs.length - 1) inputs[index + 1].focus({focusVisible: true});
			});	

			input.addEventListener('keydown', (e) => {
				if(e.key === 'Backspace' && e.target.value === '' && index > 0) inputs[index - 1].focus();
			});	
		});
    </script>
  </body>
</html>
