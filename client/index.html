<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>index</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <script type="module" src="index.js"></script>
    <div class="canvas-container">

	    <canvas id="input-canvas" width="500px" height="500px"></canvas>

      <form id="input-form">
        <input type="text" id="input1" class="input-field" maxlength="5"><br>
        <input type="text" id="input2" class="input-field" maxlength="5"><br>
        <input type="text" id="input3" class="input-field" maxlength="5"><br>
        <input type="text" id="input4" class="input-field" maxlength="5"><br>
        <input type="text" id="input5" class="input-field" maxlength="5"><br>
        <button type="submit">Submit</button>
      </form>

    </div>

    <script>
	  document.getElementById("input-form").addEventListener("submit", function(event){
        event.preventDefault();
        window.onSubmitWord(event);
      });
	  const canvas = document.getElementById("input-canvas");
	  const ctx = canvas.getContext("2d");
	  ctx.fillStyle = "grey";
    //each box is 92px wide and tall
    //spacing between them is 10px
    const size = 92;
    const padding = 10;

	  for(let i = 0; i < 5; i++){
		  for(let j = 0; j < 5; j++){
        ctx.fillRect(j * (size + padding), i * (size + padding), size, size);
		  }
	  }
    </script>
  </body>
</html>
