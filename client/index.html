<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>index</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <script type="module" src="index.js"></script>
    
    <input type="text" id="input1"  maxlength="1" class="letter-input" pattern="[a-zA-z]"><br>
    <input type="text" id="input2"  maxlength="1" class="letter-input" pattern="[a-zA-z]"><br>
    <input type="text" id="input3"  maxlength="1" class="letter-input" pattern="[a-zA-z]"><br>
    <input type="text" id="input4"  maxlength="1" class="letter-input" pattern="[a-zA-z]"><br>
    <input type="text" id="input5"  maxlength="1" class="letter-input" pattern="[a-zA-z]"><br>
    <button type="submit">Submit</button>
    

    <script>
		document.getElementById("Form").addEventListener("submit", function(event){
			event.preventDefault();
			window.onSubmitWord(event);
		});
		//putting all inputs into an array
		const inputs = document.querySelectorAll('.letter-input');
		
		inputs.forEach(updateInputs)
		
		function updateInputs(input, index){
			//adding a letter and changing to next input
			input.addEventListener('input', (e) => {
				const value = e.target.value;
				window.alert(3);
				if (value.length === 1 && index < inputs.length - 1) {
					inputs[index + 1].focus();
				}
			});	
			//deleting a letter and switching to previous input
			input.addEventListener('keydown', (e) => {
				window.alert(12);
				if (e.key === 'Backspace' && e.target.value === '' && index > 0) {
					inputs[index - 1].focus();
				}
			});	
		}
    </script>
  </body>
</html>
